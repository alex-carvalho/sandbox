apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  demo-app-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "Welcome to Loki Observability PoC",
          "type": "row"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "Loki"
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "id": 2,
          "title": "Log Rate (Log Generator)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              },
              "editorMode": "code",
              "expr": "sum(count_over_time({k8s_namespace_name=\"demo-apps\", k8s_container_name=\"flog\"}[1m])) by (k8s_pod_name)",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "unit": "short"
            }
          }
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "Loki"
          },
          "gridPos": {
            "h": 14,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "id": 3,
          "title": "Application Logs",
          "type": "logs",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              },
              "editorMode": "code",
              "expr": "{k8s_namespace_name=\"demo-apps\", k8s_container_name=\"flog\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "options": {
            "showLabels": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending"
          }
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["observability", "loki", "otel"],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ]
      },
      "timezone": "",
      "title": "Log Generator Observability",
      "uid": "log-generator-obs",
      "version": 1
    }
