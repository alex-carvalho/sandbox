deploymentMode: SimpleScalable

ignoreMinioDeprecation: true

minio:
  enabled: true
  rootUser: root-user
  rootPassword: supersecretpassword

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  image:
    tag: 3.7.0
  storage:
    type: s3
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
    s3:
      endpoint: http://loki-minio.observability.svc.cluster.local:9000
      accessKeyId: root-user
      secretAccessKey: supersecretpassword
      s3ForcePathStyle: true
      insecure: true
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
  ui:
    enabled: true

# SimpleScalable targets
write:
  replicas: 1
read:
  replicas: 1
backend:
  replicas: 1

# Disable zoneAwareReplication to allow single replica write target to schedule
ingester:
  zoneAwareReplication:
    enabled: false

# Enable query-scheduler to process read requests
# Disable Memcached caches to save memory
chunksCache:
  enabled: false
resultsCache:
  enabled: false
