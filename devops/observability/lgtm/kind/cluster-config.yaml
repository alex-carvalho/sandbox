kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lgtm-poc
nodes:
  - role: control-plane
    extraPortMappings:
      # Grafana UI -> http://localhost:3000
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      # Loan Frontend Portal & API -> http://localhost:8080
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker

