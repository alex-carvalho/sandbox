apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-queue-scaler
  namespace: keda-poc
spec:
  scaleTargetRef:
    name: keda-consumer
  minReplicaCount: 0
  maxReplicaCount: 8
  pollingInterval: 5
  cooldownPeriod: 20
  triggers:
  - type: redis
    metadata:
      address: redis.common.svc.cluster.local:6379
      listName: keda-queue
      listLength: "5"
